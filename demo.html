<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GenLayer Orbit Spinner — Demo</title>
  <link rel="stylesheet" href="spinner.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f7f6ff; color: #1d1736; }
    main { min-height: 100vh; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    section { min-height: 50vh; padding: 48px; display: grid; place-items: center; gap: 22px; text-align: center; }
    .light { background: #fbfaff; }
    .dark { background: #17112c; color: #fff; }
    h1 { margin: 0; font-size: clamp(1.3rem, 3vw, 2rem); }
    p { margin: 0; opacity: .72; max-width: 28rem; line-height: 1.55; }
    .sizes { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .badge { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #6d45e9; }
    .dark .badge { color: #b9a7ff; }
  </style>
</head>
<body>
  <main>
    <section class="light">
      <div class="badge">Light background</div>
      <h1>GenLayer Orbit</h1>
      <div class="sizes">
        <span class="genlayer-spinner genlayer-spinner--sm"><img src="genlayer-orbit-spinner.svg" alt="Loading" /></span>
        <span class="genlayer-spinner"><img src="genlayer-orbit-spinner.svg" alt="Loading" /></span>
        <span class="genlayer-spinner genlayer-spinner--lg"><img src="genlayer-orbit-spinner.svg" alt="Loading" /></span>
      </div>
      <p>A compact, smoothly looping loading state designed for Portal and dApp interfaces.</p>
    </section>
    <section class="dark">
      <div class="badge">Dark background</div>
      <h1>Infinite motion, layered consensus</h1>
      <div class="sizes">
        <span class="genlayer-spinner genlayer-spinner--sm"><img src="genlayer-orbit-spinner.svg" alt="Loading" /></span>
        <span class="genlayer-spinner"><img src="genlayer-orbit-spinner.svg" alt="Loading" /></span>
        <span class="genlayer-spinner genlayer-spinner--lg"><img src="genlayer-orbit-spinner.svg" alt="Loading" /></span>
      </div>
      <p>SVG animation works without JavaScript and includes reduced-motion support.</p>
    </section>
  </main>
</body>
</html>
